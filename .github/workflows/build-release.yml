name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: |
          gradle assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="1.0.${{ github.run_number }}"

      - name: Locate and rename APK
        working-directory: android-app
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          mkdir -p ../release-output
          cp "$APK_PATH" "../release-output/cloudcontroller-v${{ github.run_number }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CloudPhone Controller v${{ github.run_number }}
          body: |
            Auto build dari commit ${{ github.sha }}

            APK ini adalah **debug build tanpa tandatangan release** (unsigned
            for distribution outside Play Store), sesuai untuk sideload terus
            ke Phone 1. Aktifkan "Install from unknown sources" sebelum pasang.
          files: release-output/cloudcontroller-v${{ github.run_number }}.apk
